<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Gradiente Índigo / Azul Real Universal (Seta Esquerda) -->
    <linearGradient id="indigoUniversal256" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Gradiente Ciano / Sky Blue da Marca (Seta Direita) -->
    <linearGradient id="cyanGlow256" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
  </defs>

  <!-- Seta Esquerda (Índigo Elétrico - Funciona em Light & Dark) -->
  <path 
    d="M 20 20 L 136 128 L 20 236" 
    fill="none" 
    stroke="url(#indigoUniversal256)" 
    stroke-width="40" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />

  <!-- Seta Direita (Ciano Neon) -->
  <path 
    d="M 120 20 L 236 128 L 120 236" 
    fill="none" 
    stroke="url(#cyanGlow256)" 
    stroke-width="40" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
</svg>
