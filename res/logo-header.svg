<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <!-- Fundo Escuro do Tema Tekky -->
  <rect width="100%" height="100%" fill="#1a1c22" rx="12"/>

  <g transform="translate(30, 0)">
    <!-- ÍCONE: Duplo Chevron (Seta Dupla) -->
    <!-- Chevron Esquerdo (Branco) -->
    <path 
      d="M 60 75 L 145 140 L 60 205" 
      fill="none" 
      stroke="#FFFFFF" 
      stroke-width="28" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <!-- Chevron Direito (Cinza) -->
    <path 
      d="M 125 75 L 210 140 L 125 205" 
      fill="none" 
      stroke="#6E727A" 
      stroke-width="28" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- TEXTOS: TEKKY HELP -->
    <!-- "TEKKY" em Negrito Pesado (Branco) -->
    <text 
      x="250" 
      y="148" 
      fill="#FFFFFF" 
      font-family="'Montserrat', 'Inter', 'Segoe UI', 'Arial Black', sans-serif" 
      font-weight="900" 
      font-size="96px" 
      letter-spacing="1px">TEKKY</text>

    <!-- "HELP" Espaçado (Cinza) -->
    <text 
      x="254" 
      y="212" 
      fill="#7E828C" 
      font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" 
      font-weight="400" 
      font-size="48px" 
      letter-spacing="31px">HELP</text>
  </g>
</svg>
