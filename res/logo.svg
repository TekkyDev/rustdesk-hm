<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Gradiente Índigo / Azul Real Universal (Seta Esquerda) -->
    <linearGradient id="indigoUniversal32" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Gradiente Ciano / Sky Blue da Marca (Seta Direita) -->
    <linearGradient id="cyanGlow32" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
  </defs>

  <!-- Seta Esquerda (Índigo Elétrico - Funciona em Light & Dark) -->
  <path 
    d="M 2.5 2.5 L 17 16 L 2.5 29.5" 
    fill="none" 
    stroke="url(#indigoUniversal32)" 
    stroke-width="5" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />

  <!-- Seta Direita (Ciano Neon) -->
  <path 
    d="M 15 2.5 L 29.5 16 L 15 29.5" 
    fill="none" 
    stroke="url(#cyanGlow32)" 
    stroke-width="5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
</svg>
