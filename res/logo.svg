<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Fundo Deep Ocean -->
    <linearGradient id="bgOcean32" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Gradiente Ciano / Sky Blue -->
    <linearGradient id="cyanGlow32" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
  </defs>

  <!-- Fundo Squircle preenchendo 100% (0 a 32px) -->
  <rect x="0" y="0" width="32" height="32" rx="7.5" fill="url(#bgOcean32)" />

  <!-- Borda interna sutil -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="none" stroke="#334155" stroke-width="1" opacity="0.6" />

  <!-- Seta Esquerda (Branco Suave - Centralizada) -->
  <path 
    d="M 7.5 7.5 L 16.5 16 L 7.5 24.5" 
    fill="none" 
    stroke="#FFFFFF" 
    stroke-width="4" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
    opacity="0.85"
  />

  <!-- Seta Direita (Ciano Neon - Centralizada) -->
  <path 
    d="M 15.5 7.5 L 24.5 16 L 15.5 24.5" 
    fill="none" 
    stroke="url(#cyanGlow32)" 
    stroke-width="4" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
</svg>
