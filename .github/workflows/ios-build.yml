name: Build Tekky iOS (.ipa)

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.5"
  RUST_VERSION: "1.75"

jobs:
  build-ios-ipa:
    name: Build iOS Unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Dependências do Sistema
        run: |
          brew install nasm yasm

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Instalar Rust Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: "aarch64-apple-ios"
          components: "rustfmt"

      - name: Restaurar arquivos da ponte (Bridge)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bridge-artifact
          path: ./

      - name: Compilar Biblioteca Nativa Rust para iOS
        run: |
          cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios --lib

      - name: Compilar App Flutter para iOS (Sem Assinatura)
        run: |
          cd flutter
          flutter build ios --release --no-codesign

      - name: Empacotar em arquivo .IPA para Sideload
        run: |
          mkdir -p Payload
          cp -r flutter/build/ios/iphoneos/Runner.app Payload/
          zip -r TekkyRemote.ipa Payload
          
      - name: Enviar .ipa para os Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: TekkyRemote-iOS-Unsigned
          path: TekkyRemote.ipa
