name: Build macOS ARM64 (Tekky Help)

on:
  workflow_dispatch:
  push:
    branches:
      - Tekky-Help

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Toolchain do Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Instalar Gerador da Ponte Rust-Flutter
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --locked

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Gerar Ponte de Código (generated_bridge.dart)
        run: |
          flutter_rust_bridge_codegen -r src/flutter_ffi.rs -d flutter/lib/generated_bridge.dart

      - name: Instalar Dependências do Flutter
        run: |
          cd flutter
          flutter pub get

      - name: Gerar Ícones do App
        run: |
          cd flutter
          flutter pub run flutter_launcher_icons || true

      - name: Compilar para macOS (Apple Silicon ARM64)
        run: |
          cd flutter
          flutter build macos --release

      - name: Compactar o App (.app para .zip)
        run: |
          cd flutter/build/macos/Build/Products/Release
          zip -r "TekkyHelp-macOS-ARM64.zip" *.app

      - name: Disponibilizar Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: TekkyHelp-macOS-ARM64
          path: flutter/build/macos/Build/Products/Release/TekkyHelp-macOS-ARM64.zip
